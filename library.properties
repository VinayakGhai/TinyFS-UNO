sentence=A crash-consistent, wear-aware filesystem for the Arduino Uno's internal 1 KB EEPROM.
paragraph=TinyFS-UNO is an educational log-structured filesystem designed to run within the 2 KB SRAM and 32 KB Flash constraints of the ATmega328P. Features double superblocks, sector state tracking, power-loss safety, mathematical wear estimation, and an interactive Serial CLI.
